display_information:
  name: Release Advisor
  description: Checks Agentforce agents against official Salesforce release notes.
  background_color: "#0b5cab"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Release Advisor
    always_online: true
  slash_commands:
    - command: /agent-release
      description: Release-compliance report for an Agentforce agent
      usage_hint: "list | <AgentName> [current|next|both] [refresh]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - commands
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
